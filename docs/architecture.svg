<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 930" width="780" height="930" font-family="Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="780" height="930" fill="#FAFBFC" rx="8"/>

  <!-- facade (绿色) -->
  <rect x="40" y="40" width="320" height="130" rx="8" fill="#E8F5E9" stroke="#82b366" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="40" width="320" height="36" rx="8" fill="#A5D6A7"/>
  <rect x="40" y="68" width="320" height="8" fill="#A5D6A7"/>
  <text x="200" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#1B5E20">facade</text>
  <text x="200" y="98" text-anchor="middle" font-size="12" fill="#555">RPC 接口层</text>
  <text x="200" y="118" text-anchor="middle" font-size="11" fill="#777">纯接口 + DTO 记录</text>
  <text x="200" y="138" text-anchor="middle" font-size="11" fill="#777">零外部依赖</text>

  <!-- starter (琥珀色) -->
  <rect x="420" y="40" width="320" height="130" rx="8" fill="#FFF8E1" stroke="#d6b656" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="40" width="320" height="36" rx="8" fill="#FFE082"/>
  <rect x="420" y="68" width="320" height="8" fill="#FFE082"/>
  <text x="580" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#E65100">starter</text>
  <text x="580" y="98" text-anchor="middle" font-size="12" fill="#555">自定义 Spring Boot Starter</text>
  <text x="580" y="118" text-anchor="middle" font-size="11" fill="#777">自动配置示例</text>
  <text x="580" y="138" text-anchor="middle" font-size="11" fill="#777">spring-boot-starter</text>

  <!-- domain (蓝色) -->
  <rect x="140" y="260" width="500" height="150" rx="8" fill="#E3F2FD" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow)"/>
  <rect x="140" y="260" width="500" height="36" rx="8" fill="#90CAF9"/>
  <rect x="140" y="288" width="500" height="8" fill="#90CAF9"/>
  <text x="390" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">domain</text>
  <text x="390" y="318" text-anchor="middle" font-size="12" fill="#555">业务领域层</text>
  <text x="390" y="338" text-anchor="middle" font-size="11" fill="#777">Entity / Repository / Service</text>
  <text x="390" y="358" text-anchor="middle" font-size="11" fill="#777">JPA + 缓存 + 校验 + MapStruct</text>
  <text x="390" y="378" text-anchor="middle" font-size="11" fill="#777">订单状态模式 + 事件驱动 + 乐观锁重试</text>

  <!-- web (紫色) -->
  <rect x="140" y="500" width="500" height="140" rx="8" fill="#F3E5F5" stroke="#9673a6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="140" y="500" width="500" height="36" rx="8" fill="#CE93D8"/>
  <rect x="140" y="528" width="500" height="8" fill="#CE93D8"/>
  <text x="390" y="524" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A148C">web</text>
  <text x="390" y="558" text-anchor="middle" font-size="12" fill="#555">HTTP 接口层</text>
  <text x="390" y="578" text-anchor="middle" font-size="11" fill="#777">Controller + 全局异常处理</text>
  <text x="390" y="598" text-anchor="middle" font-size="11" fill="#777">OpenAPI 文档 + 邮件适配器</text>

  <!-- app (红色) -->
  <rect x="140" y="730" width="500" height="130" rx="8" fill="#FFEBEE" stroke="#b85450" stroke-width="2" filter="url(#shadow)"/>
  <rect x="140" y="730" width="500" height="36" rx="8" fill="#EF9A9A"/>
  <rect x="140" y="758" width="500" height="8" fill="#EF9A9A"/>
  <text x="390" y="754" text-anchor="middle" font-size="15" font-weight="bold" fill="#B71C1C">app</text>
  <text x="390" y="788" text-anchor="middle" font-size="12" fill="#555">主应用入口</text>
  <text x="390" y="808" text-anchor="middle" font-size="11" fill="#777">Spring Boot 启动类</text>
  <text x="390" y="828" text-anchor="middle" font-size="11" fill="#777">Async / Cache / Swagger 配置</text>

  <!-- 箭头 facade → domain -->
  <path d="M 200 170 L 200 230 Q 200 245 215 245 L 375 245 Q 390 245 390 260" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="218" y="233" width="150" height="20" rx="10" fill="#FFF" stroke="#CCC" stroke-width="1"/>
  <text x="293" y="247" text-anchor="middle" font-size="11" fill="#555">domain 实现 facade 接口</text>

  <!-- 箭头 starter → domain -->
  <path d="M 580 170 L 580 230 Q 580 245 565 245 L 405 245 Q 390 245 390 260" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <rect x="470" y="233" width="150" height="20" rx="10" fill="#FFF" stroke="#CCC" stroke-width="1"/>
  <text x="545" y="247" text-anchor="middle" font-size="11" fill="#555">starter 可选集成 domain</text>

  <!-- 箭头 domain → web -->
  <path d="M 390 410 L 390 500" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="310" y="443" width="160" height="20" rx="10" fill="#FFF" stroke="#CCC" stroke-width="1"/>
  <text x="390" y="457" text-anchor="middle" font-size="11" fill="#555">web 调用 domain 的 RpcService</text>

  <!-- 箭头 web → app -->
  <path d="M 390 640 L 390 730" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="328" y="673" width="124" height="20" rx="10" fill="#FFF" stroke="#CCC" stroke-width="1"/>
  <text x="390" y="687" text-anchor="middle" font-size="11" fill="#555">app 依赖 web</text>

</svg>