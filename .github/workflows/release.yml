name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build
        run: mvn clean package -DskipTests -B

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## 🚀 Release ${{ steps.version.outputs.VERSION }}

            ### 📦 Downloads
            - JAR: `shopping-mall-${{ steps.version.outputs.VERSION }}.jar`

            ### 🔗 Quick Start
            ```bash
            java -jar shopping-mall-${{ steps.version.outputs.VERSION }}.jar
            ```
          files: shopping-mall-app/target/shopping-mall-*.jar
          generate_release_notes: true

      - name: Publish to GitHub Packages
        run: mvn deploy -DskipTests -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}