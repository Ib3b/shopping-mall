spring:
  datasource:
    url: jdbc:sqlite:shopping-prod.db
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 60000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never

  cache:
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=600s

server:
  port: 8080
  compression:
    enabled: true

logging:
  level:
    com.example.shopping: INFO
    org.hibernate.SQL: WARN