spring:
  datasource:
    url: jdbc:sqlite:shopping-dev.db
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

jwt:
  secret: dev-only-secret-key-at-least-32-bytes-long
  expiration-ms: 86400000

logging:
  level:
    com.example.shopping: DEBUG
    org.hibernate.SQL: DEBUG