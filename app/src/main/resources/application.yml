spring:
  application:
    name: shopping-mall
  profiles:
    active: dev

  datasource:
    url: jdbc:sqlite:shopping.db
    driver-class-name: org.sqlite.JDBC
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ShoppingHikariPool

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  cache:
    cache-names: userCache,productCache
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  # 静态资源配置
  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/
  mvc:
    throw-exception-if-no-handler-found: false
    static-path-pattern: /**

server:
  port: 8080

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,beans,conditions,env,metrics,mappings
      base-path: /actuator
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.example.shopping: DEBUG
    org.hibernate.SQL: DEBUG

# 自定义 Starter 配置
myapp:
  greeting:
    prefix: "欢迎光临"
    enabled: true