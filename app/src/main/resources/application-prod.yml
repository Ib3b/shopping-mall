spring:
  datasource:
    url: jdbc:sqlite:shopping-prod.db
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 60000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true

logging:
  level:
    com.example.shopping: INFO
    org.hibernate.SQL: WARN
  file:
    name: logs/shopping-mall.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB