spring:
  datasource:
    url: jdbc:h2:mem:test-${random.uuid}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  
  sql:
    init:
      mode: never
  
  mail:
    host: localhost
    port: 25

jwt:
  secret: test-only-secret-key-at-least-32-bytes-long
  expiration-ms: 86400000

management:
  health:
    mail:
      enabled: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html